<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes">
    <title>TypeMaster Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="app-container">
            <header class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M552 64H24C10.75 64 0 74.75 0 88v336c0 13.25 10.75 24 24 24h528c13.25 0 24-10.75 24-24V88C576 74.75 565.3 64 552 64zM144 320c0 8.875-7.125 16-16 16H80C71.13 336 64 328.9 64 320v-32c0-8.875 7.125-16 16-16h48c8.875 0 16 7.125 16 16V320zM64 240v-32c0-8.875 7.125-16 16-16h48c8.875 0 16 7.125 16 16v32c0 8.875-7.125 16-16 16H80C71.13 256 64 248.9 64 240zm80 80c0-8.875 7.125-16 16-16h96c8.875 0 16 7.125 16 16v32c0 8.875-7.125 16-16 16h-96c-8.875 0-16-7.125-16-16V320zm112-80c0 8.875-7.125 16-16 16h-96c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h96c8.875 0 16 7.125 16 16v32zm160 128c0 8.875-7.125 16-16 16h-96c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h96c8.875 0 16 7.125 16 16V368zm0-80c0 8.875-7.125 16-16 16h-96c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h96c8.875 0 16 7.125 16 16V288zm0-80c0 8.875-7.125 16-16 16h-96c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h96c8.875 0 16 7.125 16 16V208zm112 160c0 8.875-7.125 16-16 16h-48c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h48c8.875 0 16 7.125 16 16V368zm0-80c0 8.875-7.125 16-16 16h-48c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h48c8.875 0 16 7.125 16 16V288zm0-80c0 8.875-7.125 16-16 16h-48c-8.875 0-16-7.125-16-16v-32c0-8.875 7.125-16 16-16h48c8.875 0 16 7.125 16 16V208z"/></svg>
                <h2>TypeMaster Pro</h2>
            </header>
            
            <div id="header">
                <div id="info"></div>
                <div id="buttons">
                    <button id="newGameBtn">New Game</button>
                </div>
            </div>
            
            <div id="game" tabindex="0">
                <div id="words"></div>
                <div id="cursor"></div>
                <div id="focus-error">Click here to start typing</div>
            </div>
            
            <div class="stats">
                <h3>Your typing stats will appear here when you finish!</h3>
            </div>
        </div>
        
        <footer>
            TypeMaster Pro - Test and improve your typing speed
        </footer>
    </main>
    
    <script src="typing.js"></script>
</body>
</html>
